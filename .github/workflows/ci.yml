name: SERVARI verification

on:
  push:
    branches: [ master, release/** ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  python-verification:
    name: Python verification harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run one-command verification
        run: python scripts/verify_all.py

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: verification/last-run.json
          if-no-files-found: ignore

  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest

      - name: Run pytest suite
        run: python -m pytest tests/ -q

  ui-build:
    name: UI build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install UI dependencies
        working-directory: ui
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Audit production UI dependencies
        working-directory: ui
        run: npm audit --omit=dev
